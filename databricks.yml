# Databricks Asset Bundle — deploys the ADO companion as a Databricks App.
#
# One target per workspace. Each target's host comes from a Databricks CLI auth
# profile, so nothing workspace-specific is hardcoded here. Deploy with the
# matching profile, e.g.:
#
#   databricks bundle deploy -t dev  -p dev
#   databricks bundle deploy -t stg  -p stg
#   databricks bundle deploy -t prod -p prod
#
# All environment-specific config (ADO org URL + PAT) lives in a per-workspace
# secret scope `ado` (keys: ado_org_url, ado_pat). The bundle and app.yaml are
# identical across environments — only the secrets differ per workspace. That is
# what makes dev/stg/prod a profile + secret swap, not a code change.
bundle:
  name: ado

targets:
  dev:
    mode: development   # name-prefixed + isolated per user
    default: true
  stg:
    mode: production
  prod:
    mode: production

resources:
  jobs:
    ado_analytics_ingest:
      name: ado-analytics-ingest
      description: "Ingest ADO Analytics OData into Delta (work_items, work_item_daily) for Genie"
      # Paused by default — unpause after creating the Genie Space (docs/GENIE.md).
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"   # daily 05:00 UTC
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        - task_key: ingest
          environment_key: default
          spark_python_task:
            python_file: ./jobs/ingest_ado_analytics.py
            parameters: ["--catalog", "main", "--schema", "ado_analytics", "--project", ""]
      environments:
        - environment_key: default
          spec:
            client: "2"

  apps:
    ado_app:
      name: ado-companion
      description: "Azure DevOps companion — work items, PRs, pipelines, + Genie analytics"
      source_code_path: ./src
      resources:
        # Referenced by `valueFrom:` in src/app.yaml. Each points at the `ado`
        # secret scope in *this* workspace, so values differ per environment.
        - name: ado_org_url
          secret:
            scope: ado
            key: ado_org_url
            permission: READ
        - name: ado_pat
          secret:
            scope: ado
            key: ado_pat
            permission: READ
