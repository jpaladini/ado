# Databricks Asset Bundle — deploys the ADO companion as a Databricks App.
#
# The workspace host comes from your Databricks CLI auth profile
# (`databricks auth login --host https://<workspace>`), so it is NOT hardcoded
# here — that's also what makes dev -> prod a profile swap, not a code change.
#
#   Dev  -> personal Free Edition workspace
#   Prod -> corporate workspace (paid; runs continuously, no 24h app cap)
#
# Setup is automated by scripts/setup.sh. Manual flow:
#   databricks bundle deploy -t dev
#   databricks bundle run ado_app -t dev
bundle:
  name: ado

targets:
  dev:
    mode: development
    default: true
    # host resolved from the active CLI profile (or `-p <profile>`)
  prod:
    mode: production
    # deploy with the corporate profile: databricks bundle deploy -t prod -p <corp>

resources:
  apps:
    ado_app:
      name: ado-companion
      description: "Azure DevOps companion — work items, PRs, pipelines, + Genie analytics"
      source_code_path: ./src
      resources:
        # Referenced by `valueFrom: ado_pat` in src/app.yaml. Grants the app's
        # service principal READ on secret scope `ado`, key `ado_pat`.
        - name: ado_pat
          secret:
            scope: ado
            key: ado_pat
            permission: READ
