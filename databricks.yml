# Databricks Asset Bundle — deploys the ADO companion as a Databricks App.
#
# Dev  -> personal Free Edition workspace
# Prod -> corporate workspace (paid; runs continuously, no 24h app cap)
#
# Deploy:  databricks bundle deploy -t dev
# Run:     databricks bundle run ado_app -t dev
bundle:
  name: ado

variables:
  ado_org_url:
    description: "Azure DevOps org base URL, e.g. https://dev.azure.com/my-org"
    default: "https://dev.azure.com/CHANGE_ME"
  ado_secret_scope:
    description: "Databricks secret scope holding the ADO PAT (key: ado_pat)"
    default: "ado"

targets:
  dev:
    mode: development
    default: true
    workspace:
      # Your personal Free Edition workspace URL
      host: https://CHANGE_ME.cloud.databricks.com

  prod:
    mode: production
    workspace:
      # Corporate workspace URL (set when migrating)
      host: https://CHANGE_ME.cloud.databricks.com

resources:
  apps:
    ado_app:
      name: ado-companion
      description: "Azure DevOps companion — work items, PRs, pipelines, + Genie analytics"
      source_code_path: ./src
