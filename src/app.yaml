# Databricks App entrypoint.
# The app must listen on the port Databricks injects via DATABRICKS_APP_PORT
# (serve.py reads it; defaults to 8000 for local dev).
command:
  - "python"
  - "serve.py"

env:
  # Azure DevOps org base URL, e.g. https://dev.azure.com/my-org
  - name: ADO_ORG_URL
    value: "https://dev.azure.com/CHANGE_ME"

  # ADO Personal Access Token. `valueFrom` references the `ado_pat` resource
  # declared in databricks.yml (which maps to secret scope `ado`, key `ado_pat`).
  # Databricks decrypts it at runtime; it is never stored in plaintext here.
  - name: ADO_PAT
    valueFrom: ado_pat
