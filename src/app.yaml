# Databricks App entrypoint.
# The app must listen on the port Databricks injects via DATABRICKS_APP_PORT
# (serve.py reads it; defaults to 8000 for local dev).
command:
  - "python"
  - "serve.py"

env:
  # Azure DevOps org base URL, e.g. https://dev.azure.com/my-org
  - name: ADO_ORG_URL
    value: "https://dev.azure.com/CHANGE_ME"

  # ADO Personal Access Token, sourced from a Databricks secret.
  # Create it first:  databricks secrets create-scope ado
  #                   databricks secrets put-secret ado ado_pat
  - name: ADO_PAT
    valueFrom: "ado/ado_pat"
