# Mirror pushes from GitHub → Azure DevOps Repos.
#
# On every push (except to the protected dev/stg/prod branches), force-push the
# branch to the same-named branch in Azure DevOps. You then open PRs from that
# branch into dev/stg/prod *inside* ADO — so the protected-branch gates and the
# branch-based deploy pipeline (azure-pipelines.yml) stay in control.
#
# One-time setup — add two repository secrets (Settings → Secrets and variables
# → Actions) on the GitHub repo:
#   ADO_REPO_URL  e.g. https://dev.azure.com/jpaladini85/home/_git/ado
#   ADO_PAT       an Azure DevOps PAT with scope: Code (Read & Write)
# The PAT lives only in GitHub Secrets — never in this session or the repo.
name: Mirror to Azure DevOps

on:
  push:
    branches-ignore:
      - dev
      - stg
      - prod

concurrency:
  group: mirror-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push branch to Azure DevOps
        env:
          ADO_PAT: ${{ secrets.ADO_PAT }}
          ADO_REPO_URL: ${{ secrets.ADO_REPO_URL }}
          BRANCH: ${{ github.ref_name }}
          GIT_TERMINAL_PROMPT: "0" # fail fast instead of prompting for a username
        run: |
          set -euo pipefail
          if [ -z "${ADO_PAT:-}" ] || [ -z "${ADO_REPO_URL:-}" ]; then
            echo "ADO_PAT / ADO_REPO_URL secrets not set — skipping mirror."
            exit 0
          fi
          case "$ADO_REPO_URL" in
            https://*) rest="${ADO_REPO_URL#https://}" ;;
            *) echo "ADO_REPO_URL must be an https:// URL (e.g. https://dev.azure.com/<org>/<project>/_git/<repo>)"; exit 1 ;;
          esac
          rest="${rest#*@}"          # drop any credentials already in the URL
          rest="${rest%/}"          # drop a trailing slash
          echo "::add-mask::$ADO_PAT"
          # Azure DevOps accepts the PAT as the password (any non-empty username).
          git push --force "https://pat:${ADO_PAT}@${rest}" "HEAD:refs/heads/${BRANCH}"
          echo "Mirrored '${BRANCH}' → Azure DevOps (${rest})."
